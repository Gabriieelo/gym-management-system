spring.application.name=gym-management-system

# Configuración de conexión a MySQL en Docker
spring.datasource.url=jdbc:mysql://localhost:3306/gym_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Seguridad. En producción se deben definir JWT_SECRET, ADMIN_USERNAME y ADMIN_PASSWORD.
app.security.jwt-secret=${JWT_SECRET:clave-local-de-desarrollo-de-32-caracteres-minimo}
app.security.token-hours=8
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin123!}
app.admin.name=${ADMIN_NAME:Administrador}

# Documentación interactiva
springdoc.swagger-ui.path=/swagger-ui.html
